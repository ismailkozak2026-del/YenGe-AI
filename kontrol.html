    <script>
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1 || urlStr.indexOf('protocol=') !== -1 || urlStr.indexOf('24678') !== -1) {
              var dummy = {
                url: urlStr,
                readyState: 1,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') setTimeout(listener, 10);
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  try { dummy.onopen({ type: 'open', target: dummy }); } catch (e) {}
                }
              }, 10);
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var originalError = window.console.error;
        window.console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + (arg && (arg.message || arg.stack || (typeof arg.toString === 'function' ? arg.toString() : String(arg))));
          }
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
            return;
          }
          originalError.apply(window.console, arguments);
        };
      })();
    </script>
